<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SSC 生徒管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3F6FB;--surface:#FFFFFF;--surface2:#F7F9FC;--ink:#1A2439;--heading:#13254A;--muted:#5A6781;--faint:#8A95AA;
  --rule:#DCE3EE;--blue:#2D5DC2;--blue-soft:#E6EDFA;--accent:#DC7431;--accent-soft:#FBEADB;
  --green:#1F8A5B;--green-soft:#E1F3EA;--amber:#A86A12;--amber-soft:#FCF1DA;--red:#C2413B;--red-soft:#FBE6E4;
  --nav:#13254A;--nav-ink:#EEF2F9;--nav-muted:#A9B7D3;
  --shadow:0 12px 32px -18px rgba(19,37,74,.35);
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Inter","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424;--surface:#16213A;--surface2:#121B2F;--ink:#E3E9F4;--heading:#F2F5FB;--muted:#9AA7BF;--faint:#6F7C95;
    --rule:#26334F;--blue:#86A9F2;--blue-soft:#1B2B4D;--accent:#F09A5C;--accent-soft:#3A2717;
    --green:#5CC996;--green-soft:#15352A;--amber:#E8B45A;--amber-soft:#382A12;--red:#F08A84;--red-soft:#3D1D1C;
    --nav:#0A1020;--nav-ink:#E3E9F4;--nav-muted:#8494B3;--shadow:0 12px 32px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424;--surface:#16213A;--surface2:#121B2F;--ink:#E3E9F4;--heading:#F2F5FB;--muted:#9AA7BF;--faint:#6F7C95;
  --rule:#26334F;--blue:#86A9F2;--blue-soft:#1B2B4D;--accent:#F09A5C;--accent-soft:#3A2717;
  --green:#5CC996;--green-soft:#15352A;--amber:#E8B45A;--amber-soft:#382A12;--red:#F08A84;--red-soft:#3D1D1C;
  --nav:#0A1020;--nav-ink:#E3E9F4;--nav-muted:#8494B3;--shadow:0 12px 32px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* Login */
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--nav);padding:16px;z-index:100}
.login-box{background:var(--surface);border-radius:18px;padding:36px 30px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.login-box .brand{justify-content:center;margin-bottom:22px}
.login-box h1{font-size:18px;color:var(--heading)}
.login-box label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.login-err{color:var(--red);font-size:12px;min-height:18px;margin-top:10px;text-align:center}

/* Shell */
.app{display:none;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:20px 12px;z-index:20}
.side .brand{padding:0 8px 22px}
.side .brand b{display:block;font-size:14px}
.side .brand small{display:block;color:var(--nav-muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--nav-muted);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--nav-ink)}
.nav button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .sh{display:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-family:var(--num)}
.side-foot{margin-top:auto;font-size:11px;color:var(--nav-muted);padding:0 8px;word-break:break-all}
.side-foot button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.18);color:var(--nav-muted);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
.main{margin-left:220px;padding:28px 32px 60px;max-width:1400px}
.demo-bar{background:var(--amber-soft);color:var(--amber);font-size:12px;padding:6px 12px;border-radius:8px;margin-bottom:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:22px;color:var(--heading);letter-spacing:.03em}
.head p{color:var(--muted);font-size:13px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1424}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 11px;outline:none;font-size:14px;min-height:38px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.inp{min-height:84px;resize:vertical}
#f-note{min-height:420px;line-height:1.8}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--surface);color:var(--heading);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .n{font-family:var(--num);font-size:11px;margin-left:4px;opacity:.7}

/* Cards */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px}
.card h3{font-size:14px;color:var(--heading);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--num);font-size:26px;font-weight:700;color:var(--heading);line-height:1.3;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;font-family:var(--sans)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.ok i{background:var(--green)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--blue);border-radius:5px}
.hbar .c{text-align:right;font-family:var(--num);color:var(--muted)}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:13px}
.li:first-child{border-top:0}
.li .who{cursor:pointer;font-weight:500}
.li .who:hover{color:var(--blue)}
.empty{color:var(--faint);font-size:13px;padding:14px 0;text-align:center}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.cols .stack{width:100%;max-width:34px;position:relative;flex:1;display:flex;align-items:flex-end}
.cols .stack i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:1px}
.cols .stack i.fut{background:var(--blue-soft);border:1px dashed var(--blue)}
.cols .stack b{position:absolute;left:-3px;right:-3px;height:2px;background:var(--accent)}
.cols .lb{font-size:11px;color:var(--muted);font-family:var(--num)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* Badges & chips */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-on{background:var(--green-soft);color:var(--green)}
.b-pause{background:var(--amber-soft);color:var(--amber)}
.b-end{background:var(--surface2);color:var(--faint);border:1px solid var(--rule)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-red{background:var(--red-soft);color:var(--red)}
.sv-q{padding:12px 0;border-top:1px solid var(--rule);font-size:13px}
.sv-q:first-of-type{border-top:0}
.sv-qh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sv-qh b{flex:none;color:var(--heading)}
.sv-q .hbar{grid-template-columns:minmax(120px,190px) 1fr 28px}
.sv-text{align-items:flex-start;white-space:pre-wrap}
.sv-text small{flex:none;color:var(--faint)}
.att-card{margin-bottom:10px}
.att-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.att-total{text-align:right;flex:none;font-size:11px;color:var(--muted)}
.att-total b{font-size:24px;color:var(--heading);line-height:1.1}
.att-total small{margin-left:2px}
.att-row{display:flex;gap:8px;align-items:flex-start;padding:7px 0 0;margin-top:7px;border-top:1px solid var(--rule);font-size:12px}
.att-row>span{flex:0 0 58px;color:var(--muted)}
.rd-ev{display:flex;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--rule);cursor:pointer}
.chip.ok{background:var(--green-soft);color:var(--green);cursor:pointer}
.chip.trial{background:var(--blue-soft);color:var(--blue);cursor:pointer}
.chip.off{background:var(--surface2);color:var(--faint);cursor:pointer}
.chip.wait{background:var(--amber-soft);color:var(--amber);cursor:pointer}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin:1px 3px 1px 0;white-space:nowrap}
.checks{display:flex;gap:4px}
.ck{border:1px solid var(--rule);background:var(--surface);color:var(--faint);font-size:11px;padding:2px 7px;border-radius:6px;cursor:pointer;white-space:nowrap}
.ck.on{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:700}
.ck.on::before{content:"✓ "}

/* Toolbar & table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .inp{width:auto;min-width:120px}
.toolbar .search{flex:1;min-width:200px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:0 6px;user-select:none}
.tbl-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th .ar{font-size:10px;margin-left:3px}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td .nm{font-weight:700;color:var(--heading)}
td small{display:block;color:var(--faint);font-size:11px;line-height:1.3}
tfoot td{background:var(--surface2);font-weight:700;border-top:1px solid var(--rule);border-bottom:0}
.cards{display:none;flex-direction:column;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer}
.mcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mcard .meta{font-size:12px;color:var(--muted);margin:6px 0}
.mcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.sum-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:10px;padding:0 4px;flex-wrap:wrap;gap:8px}
.sum-line b{color:var(--heading);font-family:var(--num);font-size:15px}
tr.undecided td{background:var(--amber-soft)}
tr.undecided td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.mcard.undecided{border-color:var(--amber);background:var(--amber-soft)}
.inline-sel{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:3px 6px;font-size:12px}

/* Funnel */
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.fstep{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;position:relative}
.fstep .l{font-size:12px;color:var(--muted)}
.fstep .v{font-family:var(--num);font-size:22px;font-weight:700;color:var(--heading)}
.fstep .r{font-size:11px;color:var(--faint)}
.fstep.goal .v{color:var(--accent)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:820px;box-shadow:var(--shadow);margin:auto 0}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--rule);gap:10px}
.modal-h h3{font-size:17px;color:var(--heading)}
.modal-b{padding:6px 22px 20px}
.modal-f{display:flex;justify-content:space-between;gap:8px;padding:14px 22px;border-top:1px solid var(--rule);flex-wrap:wrap}
.modal-f .r{display:flex;gap:8px;margin-left:auto}
.sec{padding-top:16px}
.sec-t{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--rule)}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
.fg .w2{grid-column:span 2}
.fg .w3{grid-column:1/-1}
.fl label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fl label .req{color:var(--red)}
.hint{font-size:11px;color:var(--faint);margin-top:4px}
.warn{font-size:12px;color:var(--amber);background:var(--amber-soft);padding:6px 10px;border-radius:8px;margin-top:8px}
.clubs{display:flex;flex-wrap:wrap;gap:8px}
.clubs select{width:auto;min-width:160px}
.pause-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pause-row .inp{width:auto}
.checkrow{display:flex;gap:10px;flex-wrap:wrap}
.cbox{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:10px;padding:9px 14px;cursor:pointer;user-select:none;font-size:14px}
.cbox input{width:16px;height:16px;accent-color:var(--green)}
.cbox.on{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:700}
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.stat3 div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat3 .l{font-size:11px;color:var(--muted)}
.stat3 .v{font-family:var(--num);font-weight:700;font-size:16px;color:var(--heading)}
.hist{max-height:220px;overflow:auto;border:1px solid var(--rule);border-radius:10px;margin-top:10px}
.hist td,.hist th{padding:6px 10px;font-size:12px;position:static}

/* Settings */
.set-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.set-item{display:flex;align-items:center;gap:6px}
.set-item .inp{min-height:34px;padding:6px 10px}
.set-item .cnt{font-size:11px;color:var(--faint);white-space:nowrap;min-width:40px;text-align:right;font-family:var(--num)}
.set-item.arch .inp{opacity:.5;text-decoration:line-through}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:13px;line-height:1}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.add-row{display:flex;gap:8px}

/* Goals */
.goal-tbl input{width:110px;text-align:right;border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:4px 8px;font-family:var(--num)}
.goal-tbl input.s{width:64px}
.goal-tbl input.note{width:100%;min-width:200px;text-align:left;font-family:var(--sans)}
.goal-tbl input::placeholder{color:var(--faint)}
.goal-tbl td.calc{font-weight:700;color:var(--heading);background:var(--surface2)}
.goal-tbl tr.cur td{background:var(--blue-soft)}
.pct{font-family:var(--num);font-size:12px;font-weight:700}
.pct.ok{color:var(--green)}.pct.mid{color:var(--amber)}.pct.low{color:var(--red)}

.confirm-bg{z-index:60}
.impact{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.impact td{padding:7px 4px;border-bottom:1px solid var(--rule);white-space:normal}
.impact td.r{text-align:right;font-family:var(--num);white-space:nowrap}
.impact .up{color:var(--green);font-weight:700}.impact .down{color:var(--red);font-weight:700}
.paycheck{width:22px;height:22px;accent-color:var(--green);cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--heading);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red);color:#fff}
.loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,16,32,.35);z-index:150}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Mobile */
@media (max-width:900px){
  .two,.three{grid-template-columns:1fr}
  .funnel{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  .side{inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08)}
  .side .brand,.side-foot{display:none}
  .nav .lg{display:none}.nav .sh{display:inline}
  .nav{flex-direction:row;width:100%;justify-content:space-around;overflow-x:auto;scrollbar-width:none}
  .nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;width:auto;flex:1 0 50px;align-items:center;position:relative;white-space:nowrap}
  .nav .cnt{position:absolute;top:0;right:12%;margin:0;font-size:9px;padding:0 5px}
  .main{margin-left:0;padding:18px 16px 96px}
  .head h2{font-size:19px}
  .tbl-wrap.resp{display:none}
  .cards{display:flex}

<script>
// ===================== 設定 =====================
// コーチング管理アプリと同じ Supabase プロジェクトを使う（anon key は公開前提のキー）
const SUPABASE_URL = 'https://lzypyxdkxxmmwuelngxa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6eXB5eGRreHhtbXd1ZWxuZ3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MTU0ODYsImV4cCI6MjA5ODI5MTQ4Nn0.khYK9x0E90wJvz3afxQTB9kDaWzaKml9ob0nJ0gb-1M';
const DEMO = new URLSearchParams(location.search).has('demo');
const sb = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUSES = ['契約中','休止中','契約終了'];
const STATUS_BADGE = {'契約中':'b-on','休止中':'b-pause','契約終了':'b-end'};
// ステージ：見送り以外は日付から自動で決まる（オリエン日→面談予定、体験日→体験予定）
const STAGES = ['オリエン面談未調整','オリエン面談予定','体験予定','入学','見送り'];
const LEAD_STAGES = ['オリエン面談未調整','オリエン面談予定','体験予定','見送り'];
const STAGE_BADGE = {'オリエン面談未調整':'b-pause','オリエン面談予定':'b-blue','体験予定':'b-on','入学':'b-on','見送り':'b-end'};
function autoStage(c){ return (c.trialSession||c.interviewDate) ? '体験予定' : c.orientDate ? 'オリエン面談予定' : 'オリエン面談未調整'; }
function stageOf(c){ return c.kind!=='lead' ? '入学' : c.stage==='見送り' ? '見送り' : autoStage(c); }
const stageRank = c => { const s=stageOf(c); return s==='見送り' ? (c.lostAt??STAGES.indexOf(autoStage(c))) : STAGES.indexOf(s); };
const GENDERS = ['男性','女性','その他'];
const PAY_METHODS = ['クレジットカード','口座振替','銀行振込','その他'];
const CHECKS = [['contract','契約書'],['payment','決済'],['line','LINE']];
const COMPANY_FOUNDED_FY = 2024; // 第1期 = 2024/9〜2025/8

const DEFAULT_MASTER = {
  clubs: [],
  cohorts: [{id:'k1', name:'1期生', start:'2026-11-10', planId:'pb1'}],
  industries: ['投資用不動産','不動産賃貸','保険','人材','IT・SaaS','広告・メディア','金融','メーカー','商社・卸','医療・介護','士業','コンサル','コーチング','経営者'],
  sources: ['紹介','Instagram','X','LINE','イベント','LP・Web','その他'],
  // 料金プラン（設定タブで編集）。各リストの一番上が新規登録時の初期値
  schedule: [], // SSCの年間スケジュール [{id, campus, date, time, title}]
  plans: {
    base:   [{id:'pb1', name:'1期生特別価格', amount:22000}, {id:'pb2', name:'通常', amount:44000}],
    option: [{id:'po1', name:'顧問', amount:55000}],
    entry:  [],
  },
};

// ===================== State =====================
const S = {
  customers: [], payments: [], master: clone(DEFAULT_MASTER), goals: {},
  view: 'dash',
  f: { q:'', status:'契約中', cohort:'', club:'', industry:'', gender:'', incomplete:false },
  lf: { q:'', stage:'active' },
  sort: { k:'start', dir:-1 },
  payMonth: curYM(),
  goalFY: fyOf(curYM()),
  marketing: { support:[], candidates:[], keyman:[], seminars:[], schools:[] },
  skStudent: '', skTerm: '',
  expenses: [],
  venues: [], vnArea: '',
  profitMonth: curYM(),
  profitBase: 'paid',
  mkTab: 'seminars',
  mkOwner: '',
  referral: { referrers:[], months:{}, baseDay:'end', log:[] },
  rfMonth: curYM(), rfDetail: null,
  attendance: { rounds:[] }, attendanceData: { forms:{}, answers:{} }, atCampus:'', atKind:'',
  survey: { rounds:[] }, surveyData: { forms:{}, answers:{} }, svRound:'',
  admin: 'no', userEmail: '',
};

// ===================== Utils =====================
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function yen(n){ return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP'); }
function man(n){ n=Number(n)||0; return Math.abs(n)>=10000 ? (Math.round(n/1000)/10).toLocaleString('ja-JP')+'万' : n.toLocaleString('ja-JP'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function curYM(){ return todayStr().slice(0,7); }
function addM(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); }
function mLabel(ym){ const [y,m]=ym.split('-'); return y+'年'+Number(m)+'月'; }
function mShort(ym){ return Number(ym.split('-')[1])+'月'; }
function fyOf(ym){ const [y,m]=ym.split('-').map(Number); return m>=9?y:y-1; }
function fyMonths(fy){ return Array.from({length:12},(_,i)=>addM(fy+'-09',i)); }
function fyLabel(fy){ return `第${fy-COMPANY_FOUNDED_FY+1}期（${fy}年9月〜${fy+1}年8月）`; }
function fmtDate(d){ if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${y}/${Number(m)}/${Number(dd)}`; }
function pct(a,b){ return b>0 ? Math.round(a/b*100) : null; }
function pctClass(p){ return p==null?'':p>=100?'ok':p>=70?'mid':'low'; }
function toast(msg,err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2400); }
function loading(v){ document.getElementById('loading').style.display=v?'flex':'none'; }

// ===================== 名前解決 =====================
const clubName = id => S.master.clubs.find(c=>c.id===id)?.name || '';
const cohortName = id => S.master.cohorts.find(c=>c.id===id)?.name || '';
const students = () => S.customers.filter(c=>c.kind!=='lead');
const leads = () => S.customers.filter(c=>c.kind==='lead');
const byId = id => S.customers.find(c=>c.id===id);
// ===== SSCスケジュール（体験の受け皿） =====
const CAMPUSES=['東京校','大阪校'];
const WD='日月火水木金土';
const mdw = d => { const t=new Date(d+'T00:00:00'); return `${t.getMonth()+1}/${t.getDate()}(${WD[t.getDay()]})`; };
const sessionOf = id => (S.master.schedule||[]).find(x=>x.id===id);
const sessionLabel = x => `${x.campus} ${mdw(x.date)}${x.time?' '+x.time:''}${x.title?' '+x.title:''}`;
const trialsOf = id => S.customers.filter(c=>c.trialSession===id && stageOf(c)!=='見送り');
const sortedSchedule = campus => [...(S.master.schedule||[])].filter(x=>!campus||x.campus===campus).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const PLAN_TYPES = [['base','基本プラン','月額'],['option','オプション','月額・任意'],['entry','入学金','初月のみ・任意']];
// 期生に紐づくプラン → なければ基本プランの一番上
function defaultPlan(cohortId){
  const M=S.master, k=M.cohorts.find(x=>x.id===cohortId);
  const b=M.plans.base.find(p=>p.id===k?.planId) || (k?.base!=null?{id:'',name:'',amount:k.base}:null) || M.plans.base[0];
  return {baseId:b?.id||'',baseName:b?.name||'',base:b?.amount||0,advisor:false,optId:'',optName:'',advisorFee:0,entryId:'',entryName:'',entryFee:0};
}
const optLabel = p => p?.optName || 'オプション';

// ===================== 売上計算 =====================
// noSales＝売上に含めない生徒（旧ラボからの0期生など）。請求・入金・目標実績・サポート報酬の対象外
function monthlyFee(c){ if(c.noSales) return 0; const p=c.plan||{}; return (Number(p.base)||0) + (p.advisor ? (Number(p.advisorFee)||0) : 0); }
function isPaused(c,ym){ return (c.pauses||[]).some(p=>p.from && ym>=p.from && (!p.to || ym<=p.to)); }
function endYM(c){ return c.endDate ? c.endDate.slice(0,7) : null; }
// その月の請求見込み額
function billOf(c,ym){
  if(c.kind==='lead' || !c.startDate || c.noSales) return 0;
  const s=c.startDate.slice(0,7), e=endYM(c);
  if(ym<s || (e && ym>e)) return 0;
  if(isPaused(c,ym)) return 0;
  return monthlyFee(c) + (ym===s ? (Number(c.plan?.entryFee)||0) : 0);
}
// 今月までの累計（請求ベース）
function billedTotal(c, until=curYM()){
  if(c.kind==='lead' || !c.startDate) return 0;
  let e=endYM(c); if(!e || e>until) e=until;
  let t=0; for(let m=c.startDate.slice(0,7); m<=e; m=addM(m,1)) t+=billOf(c,m);
  return t;
}
function activeMonths(c, until=curYM()){
  if(c.kind==='lead' || !c.startDate) return 0;
  let e=endYM(c); if(!e || e>until) e=until;
  let n=0; for(let m=c.startDate.slice(0,7); m<=e; m=addM(m,1)) if(!isPaused(c,m)) n++;
  return n;
}
const paidOf = (cid, ym) => S.payments.filter(p=>p.customerId===cid && (!ym || p.month===ym)).reduce((a,p)=>a+(Number(p.amount)||0),0);
const billMonth = ym => students().reduce((a,c)=>a+billOf(c,ym),0);
const paidMonth = ym => S.payments.filter(p=>p.month===ym).reduce((a,p)=>a+(Number(p.amount)||0),0);
const incomplete = c => CHECKS.filter(([k])=>!c.checks?.[k]).map(([,l])=>l);
const orientCount = ym => S.customers.filter(c=>c.orientDate && c.orientDate.slice(0,7)===ym).length;
const enrollCount = ym => students().filter(c=>c.startDate && c.startDate.slice(0,7)===ym).length;
function mrr(){ const m=curYM(); return students().filter(c=>c.status==='契約中').reduce((a,c)=>a+(isPaused(c,m)?0:monthlyFee(c)),0); }

// ===================== データ層 =====================
const Store = DEMO ? {
  _k:'ssc_demo_v12',
  _get(){ try{ return JSON.parse(localStorage.getItem(this._k)); }catch(e){ return null; } },
  _put(){ try{ localStorage.setItem(this._k, JSON.stringify({customers:S.customers,payments:S.payments,master:S.master,goals:S.goals,marketing:S.marketing,expenses:S.expenses,venues:S.venues,referral:S.referral,attendance:S.attendance,attendanceData:S.attendanceData,survey:S.survey,surveyData:S.surveyData})); }catch(e){} },
  async load(){ const d=this._get()||demoSeed(); Object.assign(S,{customers:d.customers,payments:d.payments,master:{...clone(DEFAULT_MASTER),...d.master},goals:d.goals||{},marketing:{...S.marketing,...(d.marketing||{})},expenses:d.expenses||[],venues:d.venues||[],referral:{...S.referral,...(d.referral||{})},attendance:d.attendance||S.attendance,attendanceData:d.attendanceData||S.attendanceData,survey:d.survey||S.survey,surveyData:d.surveyData||S.surveyData}); this._put(); },
  async saveCustomer(c){ if(!c.id){ c.id=uid(); c._created=new Date().toISOString(); S.customers.push(c);} else { const i=S.customers.findIndex(x=>x.id===c.id); S.customers[i]=c; } this._put(); return c; },
  async deleteCustomer(id){ S.customers=S.customers.filter(c=>c.id!==id); S.payments=S.payments.filter(p=>p.customerId!==id); this._put(); },
  async savePayment(p){ if(!p.id){ p.id=uid(); S.payments.push(p);} this._put(); return p; },
  async deletePayment(id){ S.payments=S.payments.filter(p=>p.id!==id); this._put(); },
  async saveSetting(key){ this._put(); },
} : {
  async load(){
    const [c,p,s] = await Promise.all([
      sb.from('ssc_customers').select('id,data,created_at').order('created_at'),
      sb.from('ssc_payments').select('id,data,created_at').order('created_at'),
      sb.from('ssc_settings').select('key,data'),
    ]);
    const err = c.error||p.error||s.error;
    if(err){ throw err; }
    S.customers = c.data.map(r=>({...r.data, id:r.id, _created:r.created_at}));
    S.payments = p.data.map(r=>({...r.data, id:r.id}));
    s.data.forEach(r=>{ if(r.key==='master') S.master={...clone(DEFAULT_MASTER),...r.data}; if(r.key==='goals') S.goals=r.data||{}; if(r.key==='marketing') S.marketing={...S.marketing,...r.data}; if(r.key==='expenses') S.expenses=Array.isArray(r.data)?r.data:[]; if(r.key==='venues') S.venues=Array.isArray(r.data)?r.data:[]; if(r.key==='referral') S.referral={...S.referral,...r.data}; if(r.key==='attendance') S.attendance={rounds:[],...r.data}; if(r.key==='attendance_data') S.attendanceData={forms:{},answers:{},...r.data}; if(r.key==='survey') S.survey={rounds:[],...r.data}; if(r.key==='survey_data') S.surveyData={forms:{},answers:{},...r.data}; });
    if(migrateMaster()) await this.saveSetting('master');
  },
  _strip(o){ const {id,_created,...d}=o; return d; },
  async saveCustomer(c){
    if(c.id){
      const {error}=await sb.from('ssc_customers').update({data:this._strip(c),updated_at:new Date().toISOString()}).eq('id',c.id);
      if(error) throw error;
      const i=S.customers.findIndex(x=>x.id===c.id); S.customers[i]=c;
    } else {
      const {data,error}=await sb.from('ssc_customers').insert({data:this._strip(c)}).select('id,created_at').single();
      if(error) throw error;
      c.id=data.id; c._created=data.created_at; S.customers.push(c);
    }
    return c;
  },
  async deleteCustomer(id){
    let r=await sb.from('ssc_payments').delete().filter('data->>customerId','eq',id); if(r.error) throw r.error;
    r=await sb.from('ssc_customers').delete().eq('id',id); if(r.error) throw r.error;
    S.customers=S.customers.filter(c=>c.id!==id); S.payments=S.payments.filter(p=>p.customerId!==id);
  },
  async savePayment(p){
    const {data,error}=await sb.from('ssc_payments').insert({data:this._strip(p)}).select('id').single();
    if(error) throw error; p.id=data.id; S.payments.push(p); return p;
  },
  async deletePayment(id){ const {error}=await sb.from('ssc_payments').delete().eq('id',id); if(error) throw error; S.payments=S.payments.filter(p=>p.id!==id); },
  async saveSetting(key){ const {error}=await sb.from('ssc_settings').upsert({key,data:S[key],updated_at:new Date().toISOString()}); if(error) throw error; },
};
// 保存済みの設定に、後から決まった変更を一度だけ反映する
function migrateMaster(){
  const M=S.master; M._mig=M._mig||[]; let changed=false;
  if(!M._mig.includes('industry-2026-10')){
    const i=M.industries.indexOf('不動産');
    if(i>=0) M.industries.splice(i,1,...['投資用不動産','不動産賃貸'].filter(x=>!M.industries.includes(x)));
    if(!M.industries.includes('コーチング')){ const j=M.industries.indexOf('その他'); M.industries.splice(j>=0?j:M.industries.length,0,'コーチング'); }
    M._mig.push('industry-2026-10'); changed=true;
  }
  if(!M._mig.includes('industry-free-input')){
    M.industries=M.industries.filter(x=>x!=='その他');
    M._mig.push('industry-free-input'); changed=true;
  }
  return changed;
}
// お金に関わる変更の前に「こう変わるけど大丈夫？」を出す。rows=[[項目, 変更前, 変更後, 差額(任意)]]
function confirmMoney(title, rows, note=''){
  return new Promise(res=>{
    const root=document.getElementById('confirm-root');
    const diff=d=>d==null?'':`<span class="${d>0?'up':d<0?'down':''}">${d>0?'+':d<0?'−':''}${yen(Math.abs(d))}</span>`;
    root.innerHTML=`<div class="modal-bg confirm-bg"><div class="modal" style="max-width:520px">
      <div class="modal-h"><h3>💰 ${esc(title)}</h3></div>
      <div class="modal-b" style="padding-top:12px"><p style="font-size:13px;color:var(--muted)">この変更で、お金の数字が次のように変わります。問題なければ「この内容で保存」を押してください。</p>
        <table class="impact">${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="r">${r[1]}</td><td class="r">→</td><td class="r"><b>${r[2]}</b></td><td class="r">${diff(r[3])}</td></tr>`).join('')}</table>
        ${note?`<p class="hint" style="margin-top:10px">${note}</p>`:''}</div>
      <div class="modal-f"><div class="r"><button class="btn" id="cm-no">やめる</button><button class="btn primary" id="cm-yes">この内容で保存</button></div></div></div></div>`;
    const done=v=>{ root.innerHTML=''; res(v); };
    document.getElementById('cm-yes').onclick=()=>done(true);
    document.getElementById('cm-no').onclick=()=>done(false);
  });
}
async function run(fn, okMsg){ try{ loading(true); const r=await fn(); if(okMsg) toast(okMsg); return r; } catch(e){ console.error(e); toast('保存に失敗しました：'+(e.message||e),true); throw e; } finally{ loading(false); } }

// ===================== 認証 =====================
// ブラウザに残ったログイン情報が壊れて固まったとき用：sb- で始まる保存データを消して読み込み直す
function resetAuth(){
  try{ Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k)); sessionStorage.setItem('ssc_auth_reset','1'); }catch(e){}
  location.reload();
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
async function init(){
  if(DEMO){ document.getElementById('user-email').textContent='デモモード'; return showApp(); }
  let reset=false; try{ reset=sessionStorage.getItem('ssc_auth_reset'); sessionStorage.removeItem('ssc_auth_reset'); }catch(e){}
  let session=null;
  try{ ({data:{session}} = await withTimeout(sb.auth.getSession(),8000)); }
  catch(e){ if(!reset) return resetAuth(); }
  if(reset && !session) document.getElementById('l-err').textContent='ログイン情報をリセットしました。もう一度ログインしてください。';
  if(session) showApp(session.user.email); else showLogin();
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='SIGNED_OUT') showLogin(); if(ev==='SIGNED_IN' && document.getElementById('app').style.display!=='block') showApp(session.user.email); });
}
function showLogin(){ document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; }
// 管理者かどうか（表示の切り替え用。実際の制限は Supabase 側の RLS で行う）
async function loadAdmin(){
  if(DEMO){ S.admin='yes'; S.userEmail='デモモード'; return; }
  try{
    const {data,error}=await withTimeout(sb.from('ssc_admins').select('email').limit(1),8000);
    if(error) S.admin=/ssc_admins|42P01|schema cache/i.test((error.code||'')+(error.message||''))?'unset':'no';
    else S.admin=data.length?'yes':'no';
  }catch(e){ S.admin='no'; }
}
async function showApp(email){
  document.getElementById('login').style.display='none';
  if(email){ document.getElementById('user-email').textContent=email; S.userEmail=email; }
  try{ loading(true); await withTimeout(Store.load(),20000); await loadAdmin(); }
  catch(e){
    loading(false);
    if(e.message==='timeout'||/JWT|token|auth/i.test(e.message||'')){
      document.getElementById('app').style.display='block';
      document.getElementById('main').innerHTML=`<div class="card"><h3>読み込みに時間がかかっています</h3><p style="color:var(--muted);margin-bottom:12px">ブラウザに残ったログイン情報が原因のことがあります。下のボタンでログインし直してください（データは消えません）。</p><button class="btn primary" onclick="resetAuth()">ログインし直す</button> <button class="btn" onclick="location.reload()">もう一度読み込む</button></div>`;
      return;
    }
    const missing = /ssc_|relation|schema cache/i.test(e.message||'');
    document.getElementById('app').style.display='block';
    document.getElementById('main').innerHTML=`<div class="card"><h3>データを読み込めませんでした</h3><p style="color:var(--muted)">${missing?'Supabase に SSC 用のテーブルがまだ作られていないようです。セットアップ用 SQL を SQL Editor で実行してから再読み込みしてください。':esc(e.message)}</p></div>`;
    return;
  }
  loading(false);
  document.getElementById('app').style.display='block';
  render();
  await ensureStudentNos(); // 同じ生徒を同時に保存しないよう順番に実行する
  if(rfAdmin()) await rfLinkAll();
}

function filteredStudents(){
  const f=S.f, q=f.q.trim().toLowerCase();
  let rows=students().filter(c=>
    (!f.status || c.status===f.status) &&
    (!f.cohort || c.cohort===f.cohort) &&
    (!f.club || (c.clubs||[]).includes(f.club)) &&
    (!f.industry || c.industry===f.industry) &&
    (!f.gender || c.gender===f.gender) &&
    (!f.incomplete || incomplete(c).length) &&
    (!q || [c.name,c.kana,c.company,c.referrer,c.note,c.industry,c.jobTitle,c.email,cohortName(c.cohort),...(c.clubs||[]).map(clubName)].join(' ').toLowerCase().includes(q))
  );
  const key={name:c=>c.kana||c.name||'',cohort:c=>cohortName(c.cohort),status:c=>STATUSES.indexOf(c.status),start:c=>c.startDate||'',months:c=>activeMonths(c),industry:c=>c.industry||'',gender:c=>c.gender||'',referrer:c=>c.referrer||'',fee:c=>monthlyFee(c),total:c=>billedTotal(c),paid:c=>paidOf(c.id)}[S.sort.k]||(c=>0);
  rows.sort((a,b)=>{ const x=key(a),y=key(b); return (x>y?1:x<y?-1:0)*S.sort.dir; });
  return rows;
}

function viewLeads(){
  const ls=leads(), q=S.lf.q.trim().toLowerCase();

  let rows=ls.filter(c=>(S.lf.stage==='active'?stageOf(c)!=='見送り':S.lf.stage==='all'?true:stageOf(c)===S.lf.stage) && (!q||[c.name,c.kana,c.company,c.referrer,c.note].join(' ').toLowerCase().includes(q)));
  // 体験日が未定の人（見送り以外）を一番上に。オリエンをしない人もいるので判定は体験日だけで行う
  const noTrial=c=>!c.trialSession && !c.interviewDate && stageOf(c)!=='見送り';

  <div class="card" style="margin-bottom:14px"><h3>今期のファネル <small>${fyLabel(fy)}</small></h3>
    <div class="funnel" style="margin:0">${f.map((v,i)=>`<div class="fstep ${i===3?'goal':''}"><div class="l">${fl[i]}</div><div class="v">${v}</div><div class="r">${i?`前段から ${pct(v,f[i-1])??'—'}%`:`今月 ${orientCount(m)}件${g.appo?' / 目標'+g.appo:''}`}</div></div>`).join('')}</div>
  </div>
  ${trialBoard()}

    <div class="seg">${[['active','進行中'],...LEAD_STAGES.map(s=>[s,s]),['all','すべて']].map(([v,l])=>`<button class="${S.lf.stage===v?'on':''}" onclick="S.lf.stage='${v}';render()">${l}<span class="n">${v==='active'?ls.filter(c=>stageOf(c)!=='見送り').length:v==='all'?ls.length:ls.filter(c=>stageOf(c)===v).length}</span></button>`).join('')}</div>
    <input class="inp search" placeholder="名前・紹介者で検索" value="${esc(S.lf.q)}" onchange="S.lf.q=this.value;render()">
  </div>
  ${undecided?`<div class="warn" style="margin:0 0 10px">⚠ 体験日が未定の人が ${undecided}名 います（一覧の一番上・黄色の行）。決まったら入力してください。</div>`:''}

    const all=classSchedule(cp), up=all.filter(x=>x.date>=today), next=up[0], rest=up.slice(1);
    const row=(x,old)=>{ const t=trialsOf(x.id); return `<div class="li" style="${old?'opacity:.55':''};align-items:flex-start"><div><b class="num">${mdw(x.date)}</b> <small style="color:var(--muted)">${esc(x.time||'')} ${esc(x.title||'')}</small>
      <div style="margin-top:3px">${t.map(c=>`<span class="chip" style="cursor:pointer" onclick="openCustomer('${c.id}')">${esc(c.name)}</span>`).join('')||'<small style="color:var(--faint)">まだいません</small>'}</div></div>
      <span class="badge ${t.length?'b-blue':'b-end'}" style="font-size:13px">${old?'終了 ':''}${t.length}名</span></div>`; };
    return `<div><div style="font-weight:700;color:var(--heading);margin-bottom:4px">${cp} <small style="color:var(--muted);font-weight:400">次回</small></div>
      <div class="list">${next?row(next,false):'<div class="empty">今後の回が登録されていません</div>'}</div>
      ${rest.length?`<details ${S.trialOpen?.[cp]?'open':''} ontoggle="(S.trialOpen=S.trialOpen||{})['${cp}']=this.open" style="margin-top:4px"><summary style="cursor:pointer;font-size:12px;color:var(--blue);padding:4px 0">以降の回を表示（${rest.length}回・体験 ${rest.reduce((a,x)=>a+trialsOf(x.id).length,0)}名）</summary><div class="list">${rest.map(x=>row(x,false)).join('')}</div></details>`:''}</div>`;
  };
  const noSched=!(S.master.schedule||[]).length;

  return `<div class="card" style="margin-bottom:14px"><h3>体験の予定 <small>${unset?`体験日未定 ${unset}名 ・ `:''}回ごとの体験人数</small></h3>

}
// 見送り・入学は手動。それ以外は日付で自動なので、選んでも日付どおりに戻る
async function setStage(id,v,el){
  const c=clone(byId(id)), auto=autoStage(c);
  if(v==='入学'){ if(el) el.value=stageOf(c); return enroll(id); }
  if(v==='見送り'){ c.lostAt=STAGES.indexOf(auto); c.stage='見送り'; }
  else {
    c.stage='';
    if(v!==auto){ if(el) el.value=auto; toast(v==='オリエン面談予定'?'オリエン日を入れると自動で「オリエン面談予定」になります':v==='体験予定'?'体験日を選ぶと自動で「体験予定」になります':'オリエン日・体験日を消すと「未調整」に戻ります',true); if(byId(id).stage!=='見送り') return; }
  }
  await run(()=>Store.saveCustomer(c),'ステージを更新しました'); render();
}

// チェックON＝請求額どおり入金を記録、OFF＝その月の入金記録を取り消し
async function togglePaid(cid,on,el){
  const c=byId(cid), m=S.payMonth;
  if(on) return quickPay(cid);
  const pays=S.payments.filter(p=>p.customerId===cid&&p.month===m), amt=pays.reduce((a,p)=>a+(Number(p.amount)||0),0);
  const rows=[[`${mLabel(m)}の入金（${c.name}）`,yen(amt),yen(0),-amt]];
  if(!(await confirmMoney('入金確認の取り消し',rows,'入金の記録を削除します。'))){ el.checked=true; return; }
  await run(async()=>{ for(const p of pays) await Store.deletePayment(p.id); },'入金確認を取り消しました'); render();
}
async function quickPay(cid){
  const c=byId(cid), m=S.payMonth, amt=billOf(c,m)-paidOf(cid,m);
  await run(()=>Store.savePayment({customerId:cid,month:m,amount:amt,date:todayStr(),method:c.payMethod||''}),`${c.name}さんを入金済にしました`);
  if(!c.checks?.payment){ const cc=clone(c); cc.checks={...(cc.checks||{}),payment:true}; await Store.saveCustomer(cc).catch(()=>{}); }
  render();
}

  const m=S.payMonth, list=students().filter(c=>billOf(c,m)>paidOf(c.id,m));

// ===================== 目標 =====================
let goalTimer;
// 単価・契約率は「入力した月以降に引き継ぐ」。その月より前で一番近い入力値を返す
function goalCarry(m,k){
  let best=null;
  for(const key in S.goals){ const v=S.goals[key]?.[k]; if(key<=m && v!==''&&v!=null && (!best||key>best)) best=key; }
  return best ? Number(S.goals[best][k]) : null;
}
// 月の目標（売上＝単価×入学目標、オリエン＝入学目標÷契約率 を自動計算）
function goalOf(m){
  const g=S.goals[m]||{}, n=v=>Number(v)||0;
  const price=goalCarry(m,'price'), rate=goalCarry(m,'rate'), enroll=n(g.enroll);
  return {
    price, rate, enroll,
    sales: price!=null && enroll ? price*enroll : n(g.sales),
    appo: rate && enroll ? Math.ceil(enroll*100/rate) : n(g.appo),
    keyman:n(g.keyman), seminar:n(g.seminar), note:g.note||'',
  };
}
// 月額制なので、入学目標を積み上げた「合計人数」と、その人数分の「単月合計入金」を出す
// （各月の入学者はその月の単価で続く想定。退会は見込まない）
function goalCum(m){
  let people=0, monthly=0;
  Object.keys(S.goals).filter(k=>k<=m).sort().forEach(k=>{ const g=goalOf(k); people+=g.enroll; monthly+=g.sales; });
  return {people, monthly};
}
function goalKpis(fy){
  const ms=fyMonths(fy), G=ms.map(goalOf), sum=k=>G.reduce((a,g)=>a+g[k],0);
  // 売上目標は「単価×入学数」なので、実績もその月に入学した人の月額で比べる
  const bill=ms.reduce((a,m)=>a+students().filter(c=>c.startDate?.slice(0,7)===m).reduce((x,c)=>x+monthlyFee(c),0),0), or=ms.reduce((a,m)=>a+orientCount(m),0), en=ms.reduce((a,m)=>a+enrollCount(m),0);
  const gs=sum('sales'), ga=sum('appo'), ge=sum('enroll');
  const yearIn=ms.reduce((a,m)=>a+goalCum(m).monthly,0), last=goalCum(ms[11]);
  const bar=(a,b)=>`<div class="bar ${b&&a>=b?'ok':''}"><i style="width:${b?Math.min(100,a/b*100):0}%"></i></div>`;
  return `
    <div class="card kpi"><div class="l">年間売上目標</div><div class="v num">${yen(gs)}</div><div class="s">実績（入学者の月額） ${yen(bill)}（${pct(bill,gs)??'—'}%）</div>${bar(bill,gs)}</div>
    <div class="card kpi"><div class="l">年間入金目標（月額の積み上げ）</div><div class="v num">${yen(yearIn)}</div><div class="s">8月時点 ${last.people}名・月 ${yen(last.monthly)}</div></div>
    <div class="card kpi"><div class="l">入学目標</div><div class="v">${ge}<small>名</small></div><div class="s">実績 ${en}名（${pct(en,ge)??'—'}%）</div>${bar(en,ge)}</div>

// 入力のたびに自動計算の欄だけ更新（入力中のフォーカスを失わないように全体は再描画しない）
function updGoalCells(){
  const ms=fyMonths(S.goalFY), G=ms.map(goalOf);
  ms.forEach((m,i)=>{
    const g=G[i], e=S.goals[m]||{};
    const se=document.getElementById('g-sales-'+m); if(!se) return;
    se.innerHTML=g.sales?yen(g.sales):'<span style="color:var(--faint)">—</span>';
    const cu=goalCum(m), dash='<span style="color:var(--faint)">—</span>';
    document.getElementById('g-people-'+m).innerHTML=cu.people?`${cu.people}名`:dash;
    document.getElementById('g-monthly-'+m).innerHTML=cu.monthly?yen(cu.monthly):dash;
    document.getElementById('g-appo-'+m).innerHTML=g.appo?`${g.appo}件`:'<span style="color:var(--faint)">—</span>';
    [['price',g.price],['rate',g.rate]].forEach(([k,v])=>{ const el=document.querySelector(`.goal-tbl input[data-m="${m}"][data-k="${k}"]`); if(el) el.placeholder=(e[k]===''||e[k]==null)&&v!=null?String(v):'—'; });
  });
  const sum=k=>G.reduce((a,g)=>a+g[k],0), set=(id,h)=>{ const el=document.getElementById(id); if(el) el.innerHTML=h; };
  set('g-tot-enroll',sum('enroll')+'名'); set('g-tot-sales',yen(sum('sales'))); set('g-tot-appo',sum('appo')+'件');
  set('g-tot-rate',sum('appo')?Math.round(sum('enroll')/sum('appo')*100)+'%':'—');
  const yc=goalCum(ms[11]); set('g-tot-people',yc.people+'名'); set('g-tot-monthly',`<span title="年間の単月合計入金の合計">${yen(ms.reduce((a,m)=>a+goalCum(m).monthly,0))}</span>`);
  set('g-tot-keyman',sum('keyman')+'人'); set('g-tot-seminar',sum('seminar')+'件');
  set('goal-kpis',goalKpis(S.goalFY));
}
function setGoal(m,k,v){
  const g={...(S.goals[m]||{})};
  if(v==='') delete g[k]; else g[k]=k==='note'?v:Number(v);
  S.goals[m]=g; updGoalCells();
  clearTimeout(goalTimer);
  goalTimer=setTimeout(async()=>{ try{ await Store.saveSetting('goals'); toast('目標を保存しました'); }catch(e){ toast('保存に失敗しました：'+e.message,true); } },800);
}

// スプシ「SSC｜スキル評価・成長ポートフォリオ」へは Apps Script が10分ごとに反映（生徒→03、講師評価→07）

const termOf = d => { const [y,m]=d.split('-').map(Number); return y+(m>=7?'H2':'H1'); };
const termList = () => { const cur=termOf(todayStr()), out=new Set(['2026H2',cur]); let [y,h]=[Number(cur.slice(0,4)),cur.slice(4)]; out.add(h==='H1'?y+'H2':(y+1)+'H1'); students().forEach(c=>(c.evals||[]).forEach(e=>out.add(e.term))); return [...out].sort(); };
function nextStudentNo(){ const n=students().map(c=>Number((c.studentNo||'').replace(/\D/g,''))||0); return 'SSC'+String(Math.max(0,...n)+1).padStart(3,'0'); }
// 生徒IDがまだ無い生徒に、契約開始日の古い順で SSC001〜 を振る

  const miss=students().filter(c=>!c.studentNo).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')||(a._created||'').localeCompare(b._created||''));

  if(miss.length && ['students','skills'].includes(S.view)) render();
}

  }

// 予約ページを Apps Script（ウェブアプリ）経由で読み、空欄だけ埋める。force=true なら上書き
async function fetchVenue(force){
  const url=document.getElementById('vn-url')?.value.trim(), hint=document.getElementById('vn-hint'), api=S.master.venueApi;
  if(!api || !/^https?:\/\//.test(url||'')) return;
  hint.textContent='ページを読み取り中…';
  try{
    const r=await withTimeout(fetch(api+'?url='+encodeURIComponent(url)).then(x=>x.json()),20000);
    if(!r.ok) return hint.textContent='読み取れませんでした：'+(r.error||'');
    const set=(k,v)=>{ const el=document.getElementById('vn-'+k); if(el && v!=null && v!=='' && (force||!el.value)) el.value=v; };
    set('name',r.name); set('capacity',r.capacity); set('price',r.price); set('station',r.station); set('walk',r.walk);
    const got=[r.capacity&&'収容人数',r.price&&'料金',r.station&&'最寄駅',r.walk&&'駅からの時間'].filter(Boolean);
    hint.innerHTML=(got.length?`✅ ${got.join('・')}を読み取りました。`:'⚠ 項目を読み取れませんでした。手入力してください。')+(r.priceNote?`<br>料金は目安：${esc(r.priceNote)}（夜間料金などは予約ページで確認してください）`:'')+(r.multiple?'<br>⚠ 複数の部屋が載った一覧ページのようです。部屋ごとの詳細ページのリンクを入れると正確です。':'');
  }catch(e){ hint.textContent='読み取りに失敗しました（時間をおいて「読み取る」を押してください）'; }
}
async function saveVenue(id){
  const g=k=>document.getElementById('vn-'+k).value.trim();

  if(!rec.url && !rec.name) return toast('予約リンクか場所の名前を入れてください',true);
  const i=S.venues.findIndex(x=>x.id===rec.id); if(i>=0) S.venues[i]=rec; else S.venues.push(rec);

async function delVenue(id){ const v=S.venues.find(x=>x.id===id); if(!confirm(`「${v.name||v.url}」を削除しますか？`)) return; S.venues=S.venues.filter(x=>x.id!==id); await run(()=>Store.saveSetting('venues'),'削除しました'); closeModal(); render(); }

// ===================== 利益管理 =====================
const EXPENSE_CATS=['広告費','会場費','交通費','飲食・交際費','ツール・システム','外注費','備品・消耗品','研修・書籍','その他'];
const expOf = ym => S.expenses.filter(e=>e.month===ym);
// サポートメンバーの報酬単価（途中で上がったら、その月から新しい金額）
const salesFor = ym => S.profitBase==='paid' ? paidMonth(ym) : billMonth(ym);
// サポートメンバー報酬＝紹介FEEの支払予定額（確定済みの月は確定額）。入金実績で見るときは未来の月を引かない
const rfForProfit = ym => ym>curYM() && S.profitBase==='paid' ? {rows:[],total:0,confirmed:false} : rfResult(ym);
// 利益 = 売上 − 経費 − サポート報酬、2人で折半。各自の受取額 = 取り分 + 自分が立て替えた経費
function profitOf(ym){
  const sales=salesFor(ym), ex=expOf(ym), fee=rfForProfit(ym), sup=fee.rows.filter(x=>x.included);
  const exp=ex.reduce((a,e)=>a+(Number(e.amount)||0),0), supCost=fee.total, cost=exp+supCost, profit=sales-cost;
  const per=PARTNERS.map(p=>{ const paid=ex.filter(e=>e.payer===p).reduce((a,e)=>a+(Number(e.amount)||0),0); return {p, paid, share:profit/2, receive:profit/2+paid}; });
  return {sales,exp,supCost,cost,profit,per,ex,sup,feeConfirmed:!!fee.confirmed};
}

async function saveExpense(id){
  const v=k=>document.getElementById(k).value.trim();
  const rec={id:id||uid(), date:v('e-date'), payer:v('e-payer'), category:v('e-cat'), item:v('e-item'), amount:Number(v('e-amt'))};
  if(!rec.date||!rec.amount) return toast('日付と金額を入力してください',true);
  rec.month=rec.date.slice(0,7);
  const prev=S.expenses.find(x=>x.id===rec.id);
  if(prev && (Number(prev.amount)!==rec.amount || prev.payer!==rec.payer)){
    const d=rec.amount-Number(prev.amount);
    const rows=[['経費の金額',yen(prev.amount),yen(rec.amount),d]];
    if(prev.payer!==rec.payer) rows.push(['立て替えた人',esc(prev.payer),esc(rec.payer)]);
    if(d) rows.push([`${mLabel(rec.month)}の利益`,'',d>0?'減る':'増える',-d],['1人あたりの取り分','',d>0?'減る':'増える',Math.round(-d/2)]);
    if(!(await confirmMoney('経費の変更',rows))) return;
  }
  const i=S.expenses.findIndex(x=>x.id===rec.id); if(i>=0) S.expenses[i]=rec; else S.expenses.push(rec);
  await run(()=>Store.saveSetting('expenses'),'経費を保存しました'); S.profitMonth=rec.month; closeModal(); render();
}
async function delExpense(id){ if(!confirm('この経費を削除しますか？')) return; S.expenses=S.expenses.filter(x=>x.id!==id); await run(()=>Store.saveSetting('expenses'),'削除しました'); closeModal(); render(); }

// #region survey-core（SSC/tests/ssc_survey.test.js がこの範囲をそのまま読み込んでテストする）
// 名前を選んだ人が複数回答したら最新の1件だけ数える。匿名は見分けられないので全件
function svList(rid,answers){
  const named=new Map(), anon=[];
  [...(answers?.[rid]||[])].sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach(x=>{ if(x.cid) named.set(x.cid,x); else anon.push(x); });
  return [...named.values(),...anon].sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}
const svNums = (list,q) => list.map(x=>x.a?.[q]).filter(v=>typeof v==='number');
function svMean(list,qs){ const v=qs.flatMap(q=>svNums(list,q)); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null; }
function svYes(list,q){ const v=list.map(x=>x.a?.[q]).filter(a=>a==='はい'||a==='いいえ'); return v.length?Math.round(v.filter(a=>a==='はい').length/v.length*100):null; }
// 紹介意向スコア（NPS）＝ 9〜10点の割合 − 0〜6点の割合
function svNps(list,q){ const v=svNums(list,q); return v.length?Math.round((v.filter(n=>n>=9).length-v.filter(n=>n<=6).length)/v.length*100):null; }
function svIndicators(list){
  return {honest:svMean(list,['q1','q2','q3','q4']),challenge:svMean(list,['q5']),challengeYes:svYes(list,'q9'),contrib:svMean(list,['q10','q11','q12']),contribYes:svYes(list,'q13'),meet:svYes(list,'q22'),sat:svMean(list,['q14']),nps:svNps(list,'q16'),cont:svMean(list,['q20'])};
}

function svAnswerText(q,v){
  if(v==null||v==='') return '—';

function svQuestionBlock(q,list,no){
  const hb=rows=>{ const mx=Math.max(1,...rows.map(r=>r[1])); return `<div class="hbars" style="margin-top:8px">${rows.map(r=>`<div class="hbar" title="${esc(r[0])}：${r[1]}件"><span class="nm">${esc(r[0])}</span><span class="t"><i style="width:${r[1]/mx*100}%"></i></span><span class="c">${r[1]}</span></div>`).join('')}</div>`; };
  const vals=list.map(x=>x.a?.[q.id]);
  let head='', body='';
  if(q.type==='scale'){
    head=`平均 ${svFmt(svMean(list,[q.id]))}`;
    body=hb([5,4,3,2,1].map(n=>[`${n}${n===5?`（${q.labels?.[1]||''}）`:n===1?`（${q.labels?.[0]||''}）`:''}`,vals.filter(v=>v===n).length]).concat(q.extra?[[q.extra,vals.filter(v=>v===q.extra).length]]:[]));
  } else if(q.type==='yesno'){
    head=`はい ${svFmt(svYes(list,q.id),'%')}`;
    body=hb(['はい','いいえ'].map(l=>[l,vals.filter(v=>v===l).length]));
  } else if(q.type==='nps'){
    const v=svNums(list,q.id);
    head=`平均 ${svFmt(svMean(list,[q.id]))} ・ NPS ${svFmt(svNps(list,q.id))}`;
    body=hb([['9〜10点（推奨）',v.filter(n=>n>=9).length],['7〜8点（中立）',v.filter(n=>n>=7&&n<=8).length],['0〜6点（批判）',v.filter(n=>n<=6).length]]);
  } else if(q.type==='multi'){
    const cnt={}; vals.forEach(a=>(Array.isArray(a)?a:[]).forEach(c=>{ cnt[c]=(cnt[c]||0)+1; }));
    const known=(q.choices||[]).map(c=>[c,cnt[c]||0]), other=Object.keys(cnt).filter(c=>!(q.choices||[]).includes(c)).map(c=>[c,cnt[c]]);
    body=hb([...known,...other]);
  } else {
    const rows=list.filter(x=>x.a?.[q.id]);
    head=`${rows.length}件`;
    body=rows.length?`<div class="list" style="margin-top:6px">${rows.map(x=>`<div class="li sv-text"><span>${esc(x.a[q.id])}</span><small>${esc(svName(x))}</small></div>`).join('')}</div>`:'';
  }
  return `<div class="sv-q"><div class="sv-qh"><span>Q${no}. ${esc(q.text)}</span>${head?`<b class="num">${esc(head)}</b>`:''}</div>${body}</div>`;
}

// #region attendance-core（SSC/tests/ssc_attendance.test.js がこの範囲をそのまま読み込んでテストする）
const ATT_YES='出席', ATT_NO='欠席';
// その回に出欠を聞く受講生：契約中で、その日に在籍している人
function attTargets(ev,customers){
  return customers.filter(c=>c.kind!=='lead' && c.status==='契約中' && c.startDate && c.startDate<=ev.date && !(c.endDate && c.endDate<ev.date) && !isPaused(c,ev.date.slice(0,7)));
}
// フォームは期間が重なるので、同じ回に複数回答があれば一番新しい回答を使う
function attLatest(evId,rounds,answers){
  const out={};
  rounds.forEach(r=>Object.entries(answers?.[r.id]||{}).forEach(([cid,x])=>{
    const v=x.a?.[evId]; if(v && (!out[cid] || x.at>out[cid].at)) out[cid]={v,at:x.at};
  }));
  return out;
}
// 合計＝出席の受講生＋体験の人（同じ人は1回だけ数える）
function attSummary(ev,{customers,rounds,answers,trials}){
  const latest=attLatest(ev.id,rounds,answers), targets=attTargets(ev,customers);
  const yes=targets.filter(c=>latest[c.id]?.v===ATT_YES), no=targets.filter(c=>latest[c.id]?.v===ATT_NO);
  const trial=(trials||[]).filter(c=>!yes.some(y=>y.id===c.id));
  const none=targets.filter(c=>!latest[c.id] && !trial.some(t=>t.id===c.id));
  return {yes,no,none,trial,total:yes.length+trial.length,asked:rounds.some(r=>(r.eventIds||[]).includes(ev.id))};
}
// フォームごとの回答状況
function attRoundStatus(round,customers,answers){
  const target=customers.filter(c=>c.kind!=='lead' && c.status==='契約中' && c.startDate && c.startDate<=round.to);
  const done=target.filter(c=>answers?.[round.id]?.[c.id]);
  return {target,done,none:target.filter(c=>!done.includes(c))};
}

// ===================== 紹介FEE =====================
// #region referral-core（計算ルールはここだけ。SSC/tests/ssc_referral.test.js がこの範囲をそのまま読み込んでテストする）
const RF_MIN=6; // これ未満は0円。到達すると最初の1人目から対象
const RF_TIERS=[{rate:5000,upTo:10},{rate:7500,upTo:15},{rate:10000,upTo:Infinity}];
function referralFee(n){
  n=Math.max(0,Math.floor(Number(n)||0));
  let prev=0,total=0;
  const tiers=RF_TIERS.map(t=>{ const count=n<RF_MIN?0:Math.max(0,Math.min(n,t.upTo)-prev); prev=t.upTo; total+=count*t.rate; return {rate:t.rate,count,amount:count*t.rate}; });
  return {total,tiers};
}
const rfNorm = s => String(s||'').replace(/[\s　]/g,'');
// 運営本人の紹介は紹介FEEの対象外（紹介者欄の名前はそのまま残す）
const RF_OPERATORS=['岡部真','真','石田雄太','雄太'];
const rfIsOperator = name => RF_OPERATORS.includes(rfNorm(name));
// 計算基準日：'end'＝月末、数字＝その日（その月に無い日は月末）。按分はせず、この日に在籍しているかだけを見る
function rfBaseDate(ym,baseDay){
  const [y,m]=ym.split('-').map(Number), last=new Date(y,m,0).getDate();
  const d=(!baseDay||baseDay==='end')?last:Math.min(Number(baseDay),last);
  return ym+'-'+String(d).padStart(2,'0');
}
// 在籍＝契約開始済み・未退会・休止していない。noSales（0期生など）は売上がないので対象外
function rfEnrolled(c,ym,base,cur){
  if(c.kind==='lead' || c.noSales || !c.startDate || c.startDate>base) return false;
  if(c.endDate && c.endDate<base) return false;
  if(isPaused(c,ym)) return false;
  if(ym>=cur) return c.status==='契約中'; // 当月は最新のステータスに連動
  return !(c.status==='契約終了' && !c.endDate);
}
function rfComputeMonth(ym,{customers,referrers,baseDay,cur}){
  const base=rfBaseDate(ym,baseDay);
  const rows=referrers.filter(r=>!rfIsOperator(r.name)).map(r=>{
    const list=customers.filter(c=>c.referrerId===r.id && rfEnrolled(c,ym,base,cur));
    const f=referralFee(list.length), approved=!!r.approved && (!r.approvedAt || r.approvedAt.slice(0,7)<=ym), payable=approved && r.payable!==false; // 承認した月より前は支払わない
    return {referrerId:r.id,name:r.name,count:list.length,fee:f.total,tiers:f.tiers,approved,payable,included:payable&&f.total>0,students:list.map(c=>({id:c.id,name:c.name}))};
  });
  return {month:ym,base,rows,total:rows.reduce((a,x)=>a+(x.included?x.fee:0),0),estimate:rows.reduce((a,x)=>a+x.fee,0),enrolled:rows.reduce((a,x)=>a+x.count,0)};
}
// 確定済みの月は保存した結果を返す（その後の退会や変更で金額が変わらない）
function rfMonthResult(ym,ctx,months){ return months[ym] ? {...months[ym],confirmed:true} : {...rfComputeMonth(ym,ctx),confirmed:false}; }
function rfSnapshot(ym,ctx,by,at){
  const r=rfComputeMonth(ym,ctx);
  r.rows.forEach(x=>{ x.paid=x.included?'未払い':''; });
  return {...r,confirmedAt:at,confirmedBy:by};
}
// キーマンのうち、在籍の紹介が6人以上になった人（サポートメンバーへ移す対象）
function rfPromotions(keyman,rows){ return keyman.filter(k=>rows.some(x=>rfNorm(x.name)===rfNorm(k.name) && x.count>=RF_MIN)); }
// #endregion referral-core

const rfCtx = () => ({customers:S.customers,referrers:S.referral.referrers,baseDay:S.referral.baseDay,cur:curYM()});
const rfResult = ym => rfMonthResult(ym,rfCtx(),S.referral.months);
const rfAdmin = () => S.admin==='yes';
const rfById = id => S.referral.referrers.find(r=>r.id===id);
const rfByName = name => S.referral.referrers.find(r=>rfNorm(r.name)===rfNorm(name));
const rfWho = () => S.userEmail||'—';
const rfMemberRow = name => { const r=rfByName(name); return r ? rfResult(curYM()).rows.find(a=>a.referrerId===r.id) : null; };
const rfIsSupport = name => S.marketing.support.some(m=>rfNorm(m.name)===rfNorm(name));
const fmtDT = iso => { if(!iso) return '—'; const d=new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function rfBadge(x){
  if(!x.fee) return '<span class="badge b-end">未達</span>';
  if(!x.approved) return '<span class="badge b-pause">未承認（試算）</span>';
  if(!x.payable) return '<span class="badge b-end">支払対象外</span>';
  return '<span class="badge b-on">対象</span>';
}
// 別の人が保存した内容を消さないよう、書き込む直前に最新を読み直してから変更する
async function saveReferral(mut,msg){
  if(!rfAdmin()){ toast('変更できるのは管理者だけです',true); return false; }
  await run(async()=>{
    if(!DEMO){ const r=await sb.from('ssc_settings').select('data').eq('key','referral').maybeSingle(); if(r.error) throw r.error; if(r.data) S.referral={...S.referral,...r.data.data}; }
    mut(S.referral);
    await Store.saveSetting('referral');
  },msg);
  return true;
}
const rfLog = (R,action,detail) => { R.log=[{at:new Date().toISOString(),by:rfWho(),action,detail},...(R.log||[])].slice(0,200); };
const rfNew = name => ({id:uid(),name:name.trim(),approved:false,approvedAt:'',payable:false,note:'',createdAt:todayStr()});
// 管理者のログイン時：名前だけの紹介者（フォーム登録など）とマーケのキーマンを紹介者IDに紐づける
async function rfLinkAll(){
  const removed=S.referral.removed||[]; // 紹介FEE管理で削除した人は、キーマン一覧からは登録し直さない
  const names=[...S.customers.filter(c=>c.referrer&&!c.referrerId).map(c=>c.referrer),...[...S.marketing.keyman,...S.marketing.support].map(k=>k.name).filter(n=>!removed.includes(rfNorm(n)))].filter(n=>n&&!rfIsOperator(n));
  const fresh=[]; names.forEach(n=>{ if(!rfByName(n) && !fresh.some(x=>rfNorm(x)===rfNorm(n))) fresh.push(n); });
  try{
    // すでに紹介者として登録された運営本人を外す
    const ops=S.referral.referrers.filter(r=>rfIsOperator(r.name));
    if(ops.length){
      for(const c of S.customers.filter(c=>ops.some(r=>r.id===c.referrerId))){ const cc=clone(c); delete cc.referrerId; await Store.saveCustomer(cc); }
      await saveReferral(R=>{ R.referrers=R.referrers.filter(r=>!rfIsOperator(r.name)); });
    }
    if(fresh.length) await saveReferral(R=>fresh.forEach(n=>{ if(!R.referrers.some(r=>rfNorm(r.name)===rfNorm(n))) R.referrers.push(rfNew(n)); }));
    for(const c of S.customers.filter(c=>c.referrer&&!c.referrerId&&!rfIsOperator(c.referrer))){ const cc=clone(c), r=rfByName(c.referrer); cc.referrerId=r.id; await Store.saveCustomer(cc); }
    await rfPromote();
    if(S.view==='referral') render();
  }catch(e){ console.error(e); }
}
// キーマンの在籍紹介が6人以上になったら、サポートメンバーへ移して承認する。人数が減っても戻さない（報酬が0円になるだけ）
async function rfPromote(){
  const hits=rfPromotions(S.marketing.keyman,rfComputeMonth(curYM(),rfCtx()).rows);
  if(!hits.length) return;
  const today=todayStr(), names=hits.map(k=>k.name).join('、');
  await saveReferral(R=>hits.forEach(k=>{
    const a=R.referrers.find(r=>rfNorm(r.name)===rfNorm(k.name));
    if(a && !a.approved){ a.approved=true; a.payable=true; a.approvedAt=today; }
    rfLog(R,'サポートメンバーへ自動で移動',k.name);
  }));
  const M=S.marketing;
  hits.forEach(k=>{ const ex=M.support.find(m=>rfNorm(m.name)===rfNorm(k.name)); if(ex){ ex.keymanAt=k.addedAt||''; ex.movedAt=today; } else M.support.push({...k,id:uid(),keymanAt:k.addedAt||'',movedAt:today,addedAt:today}); });
  M.keyman=M.keyman.filter(k=>!hits.includes(k));
  await run(()=>Store.saveSetting('marketing'),`${names}さんがサポートメンバーになりました`);
}
// 生徒の保存時：入力された名前を紹介者IDに変換（なければ新しい紹介者を作る）
async function rfLinkCustomer(rec){
  const name=(rec.referrer||'').trim();
  if(!name){ rec.referrer=''; delete rec.referrerId; return true; }
  if(rfNorm(name)===rfNorm(rec.name)){ toast('本人を紹介者にはできません',true); return false; }
  if(rfIsOperator(name)){ delete rec.referrerId; return true; }
  if(!rfByName(name)) await saveReferral(R=>{ if(!R.referrers.some(r=>rfNorm(r.name)===rfNorm(name))) R.referrers.push(rfNew(name)); });
  const r=rfByName(name); rec.referrerId=r.id; rec.referrer=r.name;
  return true;
}
function rfImpactRows(rec){
  const calc=list=>rfComputeMonth(curYM(),{...rfCtx(),customers:list}).rows;
  const a=calc(S.customers), b=calc(S.customers.map(c=>c.id===rec.id?rec:c));
  return b.map((x,i)=>[x,a[i]]).filter(([x,o])=>x.fee!==o.fee).map(([x,o])=>[`紹介FEE：${x.name}（今月${x.payable||rfPromotions(S.marketing.keyman,[x]).length?'':'・試算'}）`,yen(o.fee),yen(x.fee),x.fee-o.fee]);
}

async function rfAdd(){
  const name=(prompt('紹介者の名前')||'').trim(); if(!name) return;

  if(rfByName(name)) return toast('同じ名前の紹介者がすでにいます',true);
  await saveReferral(R=>{ R.referrers.push(rfNew(name)); rfLog(R,'紹介者を追加',name); },'追加しました'); render();

async function rfRename(id){
  const r=rfById(id), name=(prompt('新しい名前',r.name)||'').trim();
  if(!name || name===r.name) return;
  if(rfIsOperator(name)) return toast('運営本人は紹介FEEの対象外です',true);
  if(rfByName(name) && rfByName(name).id!==id) return toast('同じ名前の紹介者がすでにいます',true);
  const old=r.name;
  await saveReferral(R=>{ R.referrers.find(a=>a.id===id).name=name; rfLog(R,'名前を変更',`${old} → ${name}`); });
  await run(async()=>{ for(const c of S.customers.filter(c=>c.referrerId===id)){ const cc=clone(c); cc.referrer=name; await Store.saveCustomer(cc); }
    const same=['support','keyman','candidates'].flatMap(k=>S.marketing[k]).filter(m=>rfNorm(m.name)===rfNorm(old));
    if(same.length){ same.forEach(m=>{ m.name=name; }); await Store.saveSetting('marketing'); } },'名前を変更しました'); render();
}
// 削除すると紐づく生徒の紹介者欄も空にする。キーマン一覧に名前が残っていても、次のログインで復活させない
async function rfDelete(id){
  const r=rfById(id), mine=S.customers.filter(c=>c.referrerId===id), fee=rfComputeMonth(curYM(),rfCtx()).rows.find(a=>a.referrerId===id)?.fee||0;
  if(!confirm(`紹介者「${r.name}」を削除しますか？${mine.length?`\n\n次の${mine.length}人の紹介者欄も空になります：\n${mine.map(c=>c.name).join('、')}`:''}${fee?`\n\n今月の紹介FEE ${yen(fee)} もなくなります。`:''}`)) return;
  S.rfDetail=null;

  await saveReferral(R=>{ R.referrers=R.referrers.filter(a=>a.id!==id); R.removed=[...new Set([...(R.removed||[]),rfNorm(r.name)])]; rfLog(R,'紹介者を削除',r.name); },'削除しました'); render();

  const head=['対象年月','紹介者ID','紹介者名','在籍紹介人数','月額紹介FEE','5000円枠人数','7500円枠人数','10000円枠人数','承認','報酬支払対象','支払予定額','支払状況','支払日時','区分','基準日','確定日時','確定者'];
  const body=R.rows.map(x=>[ym,x.referrerId,x.name,x.count,x.fee,...x.tiers.map(t=>t.count),x.approved?'承認済み':'未承認',x.payable?'対象':'対象外',x.included?x.fee:0,x.paid||'',x.paidAt?fmtDT(x.paidAt):'',R.confirmed?'確定':'自動計算',R.base,R.confirmed?fmtDT(R.confirmedAt):'',R.confirmedBy||'']);
  const csv=[head,...body].map(r=>r.map(cell).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=`SSC紹介FEE_${ym}.csv`; a.click();
}

function mkSemState(){ const d=document.getElementById('mk-date').value; const done=!!d&&d<todayStr(); document.getElementById('mk-state').innerHTML=done?'<span class="badge b-on">完了</span>':d?'<span class="badge b-blue">予定</span>':'<span class="badge b-end">日程未定</span>'; }
function closeMk(){ document.getElementById('modal-root').innerHTML=''; MKD=null; }
async function saveMk(){
  const key=MKD._key, v=id=>{ const e=document.getElementById('mk-'+id); return e?e.value.trim():undefined; };
  const rec={...MKD}; delete rec._key;
  ['name','owner','industry','addedAt','host','date','time','contact','status'].forEach(k=>{ const val=v(k); if(val!==undefined) rec[k]=val; });
  ['attendees','consultGoal','consultResult','contracts'].forEach(k=>{ const val=v(k); if(val!==undefined) rec[k]=val===''?null:Number(val); });
  const note=document.getElementById('mk-note'); if(note) rec.note=note.value;
  if(key==='seminars' ? !rec.host : !rec.name) return toast(key==='seminars'?'セミナー先を入力してください':'名前を入力してください',true);
  const list=S.marketing[key];
  if(rec.id){ list[list.findIndex(x=>x.id===rec.id)]=rec; } else { rec.id=uid(); list.push(rec); }
  await run(()=>Store.saveSetting('marketing'),'保存しました'); closeMk(); render();
}
// 候補 → キーマンへ移す（候補リストからは外れる）
async function promoteMk(){
  const v=id=>document.getElementById('mk-'+id)?.value.trim();
  const rec={...MKD, name:v('name'), owner:v('owner'), industry:v('industry'), note:document.getElementById('mk-note').value, candidateAt:MKD.addedAt, addedAt:todayStr()};
  delete rec._key; if(!rec.name) return toast('名前を入力してください',true);
  if(!confirm(`${rec.name}さんをキーマンに昇格しますか？`)) return;
  S.marketing.candidates=S.marketing.candidates.filter(x=>x.id!==rec.id);
  S.marketing.keyman.push(rec);
  await run(()=>Store.saveSetting('marketing'),`${rec.name}さんをキーマンにしました`); closeMk(); S.mkTab='keyman'; render();
}
// 一覧の🗑から直接削除
async function delMkRow(key,id){
  const x=S.marketing[key].find(r=>r.id===id); if(!x) return;
  if(!confirm(`「${x.name||x.host}」を削除しますか？\n（元に戻せません）`)) return;
  S.marketing[key]=S.marketing[key].filter(r=>r.id!==id);
  await run(()=>Store.saveSetting('marketing'),'削除しました'); render();
}
async function delMk(){
  const key=MKD._key; if(!confirm(`「${MKD.name||MKD.host}」を削除しますか？`)) return;
  S.marketing[key]=S.marketing[key].filter(x=>x.id!==MKD.id);
  await run(()=>Store.saveSetting('marketing'),'削除しました'); closeMk(); render();
}

async function saveMaster(){ try{ await Store.saveSetting('master'); toast('設定を保存しました'); }catch(e){ toast('保存に失敗しました：'+e.message,true); } }
function addItem(key){
  const el=document.getElementById('add-'+key), v=el.value.trim(); if(!v) return;
  const M=S.master;
  if(key==='clubs'){ if(M.clubs.some(c=>c.name===v)) return toast('同じ名前があります',true); M.clubs.push({id:uid(),name:v}); }
  else if(key==='cohorts'){ const last=M.cohorts[M.cohorts.length-1]; M.cohorts.push({id:uid(),name:v,start:'',planId:last?.planId||''}); }
  else { if(M[key].includes(v)) return toast('同じ名前があります',true); M[key].push(v); }
  saveMaster(); render(); setTimeout(()=>document.getElementById('add-'+key)?.focus(),0);
}
function addSched(cp){
  const g=k=>document.getElementById(`sc-${k}-${cp}`).value.trim();
  const d0=g('date'); if(!d0) return toast('日付を入力してください',true);
  const rep=g('rep'), n=rep==='0'?1:Math.min(60,Math.max(1,Number(g('n'))||1));
  const base=new Date(d0+'T00:00:00'), out=[];
  for(let i=0;i<n;i++){
    const t=new Date(base); if(rep==='m') t.setMonth(t.getMonth()+i); else t.setDate(t.getDate()+i*Number(rep));
    const ds=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    out.push({id:uid(),campus:cp,date:ds,time:g('time'),title:g('title'),type:g('type')});
  }
  S.master.schedule=[...(S.master.schedule||[]),...out]; saveMaster(); toast(`${cp}に${out.length}回追加しました`); render();
}
// 「9/10 19:30〜21:30 タイトル」形式の行をまとめて登録（年が無ければ今期の9月〜8月で補う）
function bulkSched(cp){
  const fy=fyOf(curYM()), out=[], bad=[];
  document.getElementById('sc-bulk-'+cp).value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const m=line.match(/^(?:(\d{4})[\/\-年.])?(\d{1,2})[\/\-月.](\d{1,2})日?(?:\s*[（(][^）)]*[）)])?\s*(.*)$/);
    if(!m) return bad.push(line);
    const mo=Number(m[2]), d=Number(m[3]), y=m[1]?Number(m[1]):(mo>=9?fy:fy+1);
    let rest=m[4]||'', time='';
    const t=rest.match(/^(\d{1,2}:\d{2}(?:\s*[〜~\-－–]\s*\d{1,2}:\d{2})?)\s*[|｜]?\s*/);
    if(t){ time=t[1].replace(/\s*[~\-－–]\s*/,'〜'); rest=rest.slice(t[0].length); }
    out.push({id:uid(),campus:cp,date:`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,time,title:rest.trim(),type:/飲み会|懇親会/.test(rest)?'party':'class'});
  });
  if(!out.length) return toast('読み取れる行がありませんでした',true);
  const dup=out.filter(x=>(S.master.schedule||[]).some(s=>s.campus===cp&&s.date===x.date));
  if(!confirm(`${cp}に ${out.length}回 を登録します。${dup.length?`\n（うち${dup.length}回は同じ日付がすでにあります）`:''}${bad.length?`\n読み取れなかった行：\n${bad.join('\n')}`:''}`)) return;
  S.master.schedule=[...(S.master.schedule||[]),...out]; saveMaster(); render();
}
function setSched(id,k,v){ const x=sessionOf(id); if(!x) return;
  if(k==='type' && v!=='class' && trialsOf(id).length){ toast('体験予定の人がいる回は変更できません',true); return render(); }
  x[k]=v.trim(); saveMaster();
  if(k==='type') return render();
  if(k==='date') S.customers.filter(c=>c.trialSession===id).forEach(c=>{ const cc=clone(c); cc.interviewDate=x.date; Store.saveCustomer(cc).catch(()=>{}); }); }
function delSched(id){
  const x=sessionOf(id), n=trialsOf(id).length;
  if(!confirm(`${sessionLabel(x)} を削除しますか？${n?`\nこの回に体験予定の ${n}名 は「体験日未定」に戻ります。`:''}`)) return;
  S.master.schedule=S.master.schedule.filter(s=>s.id!==id);
  S.customers.filter(c=>c.trialSession===id).forEach(c=>{ const cc=clone(c); cc.trialSession=''; cc.interviewDate=''; Store.saveCustomer(cc).catch(()=>{}); });
  saveMaster(); render();
}
function addPlan(t){
  const n=document.getElementById('plan-n-'+t).value.trim(), a=document.getElementById('plan-a-'+t).value;
  if(!n||a==='') return toast('プラン名と金額を入力してください',true);
  S.master.plans[t].push({id:uid(),name:n,amount:Number(a)}); saveMaster(); render();
}
function setPlan(t,i,k,v){ const p=S.master.plans[t][i]; if(k==='name'){ v=v.trim(); if(!v) return render(); p.name=v; } else p.amount=Number(v)||0; saveMaster(); }
function movePlan(t,i){ const a=S.master.plans[t]; if(!i) return; [a[i-1],a[i]]=[a[i],a[i-1]]; saveMaster(); render(); }
function delPlan(t,i){ const p=S.master.plans[t][i]; if(!confirm(`「${p.name}」を削除しますか？\n（登録済みの生徒の金額はそのまま残ります）`)) return; S.master.plans[t].splice(i,1); S.master.cohorts.forEach(k=>{ if(k.planId===p.id) k.planId=''; }); saveMaster(); render(); }
function renameItem(key,i,v){
  v=v.trim(); if(!v) return render();
  const arr=S.master[key];
  if(typeof arr[i]==='string'){ // 業種・流入経路は文字列なので、使っている生徒のデータも置き換える
    const old=arr[i]; arr[i]=v; const f=key==='industries'?'industry':'source';
    const hit=S.customers.filter(c=>c[f]===old);
    if(hit.length) run(async()=>{ for(const c of hit){ const cc=clone(c); cc[f]=v; await Store.saveCustomer(cc);} });
  } else arr[i].name=v;
  saveMaster();
}
function moveItem(key,i,d){ const a=S.master[key]; if(i+d<0||i+d>=a.length) return; [a[i],a[i+d]]=[a[i+d],a[i]]; saveMaster(); render(); }
function archiveItem(key,i){ const it=S.master[key][i]; it.archived=!it.archived; saveMaster(); render(); }
function deleteItem(key,i){
  const it=S.master[key][i], name=typeof it==='string'?it:it.name;
  const used = key==='clubs'?S.customers.filter(c=>(c.clubs||[]).includes(it.id)).length : key==='cohorts'?S.customers.filter(c=>c.cohort===it.id).length : S.customers.filter(c=>c[key==='industries'?'industry':'source']===it).length;
  if(used && key==='clubs') { if(!confirm(`「${name}」は ${used}名が所属しています。削除すると生徒の所属からも外れます。\n（残したい場合は ⏸ の廃部を使ってください）\n削除しますか？`)) return; }
  else if(used) { if(!confirm(`「${name}」は ${used}名が使用中です。削除しても生徒のデータは残りますが、選択肢からは消えます。削除しますか？`)) return; }
  else if(!confirm(`「${name}」を削除しますか？`)) return;
  S.master[key].splice(i,1); saveMaster(); render();
}

// ふりがな自動入力：氏名の漢字から辞書（kuromoji）で読みを推測して入れる
// ふりがな欄を直接書き換えたら、それ以降は自動で上書きしない（空にすると自動に戻る）
let _kanaTk=null, _kanaP=null;
function loadKanaDict(){
  if(_kanaP) return _kanaP;
  const base='https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/';
  _kanaP=new Promise((res,rej)=>{
    const go=()=>kuromoji.builder({dicPath:base+'dict/'}).build((e,t)=>e?rej(e):res(_kanaTk=t));
    if(window.kuromoji) return go();
    const sc=document.createElement('script'); sc.src=base+'build/kuromoji.js'; sc.onload=go; sc.onerror=rej; document.head.appendChild(sc);
  }).catch(e=>{ _kanaP=null; throw e; });
  return _kanaP;
}
function guessKana(name){
  const toHira=t=>t.replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
  return name.trim().split(/[\s　]+/).map(part=>toHira(_kanaTk.tokenize(part).map(x=>x.reading&&x.reading!=='*'?x.reading:x.surface_form).join(''))).join(' ');
}
function setupAutoKana(){
  const name=document.getElementById('f-name'), kana=document.getElementById('f-kana'), hint=document.getElementById('kana-hint');
  if(!name||!kana) return;
  let auto=!kana.value, timer;
  const show=msg=>{ hint.textContent=msg ?? (auto?'漢字から自動で推測します（違っていたら直接直せます）':''); };
  const fill=()=>{
    if(!auto) return;
    if(!name.value.trim()){ kana.value=''; return; }
    if(!_kanaTk) show('読みの辞書を読み込み中…');
    loadKanaDict().then(()=>{ if(auto){ kana.value=guessKana(name.value); show(); } })
      .catch(()=>show('読みの推測を読み込めませんでした（手入力してください）'));
  };
  name.addEventListener('input',()=>{ clearTimeout(timer); timer=setTimeout(fill,250); });
  kana.addEventListener('input',()=>{ auto=!kana.value; show(); });
  show();
  if(auto) loadKanaDict().catch(()=>{}); // フォームを開いた時点で辞書を先読み
}

function drawClubs(){
  const el=document.getElementById('club-sels'); if(!el) return;
  const all=S.master.clubs, active=all.filter(c=>!c.archived);
  D.clubs=D.clubs.filter(id=>all.some(c=>c.id===id));
  if(!all.length){ el.innerHTML=`<span class="hint" style="margin:0;align-self:center">部活動がまだありません。<a href="#" onclick="closeModal();go('settings');return false">設定で追加 →</a></span>`; return; }
  const n=D.clubs.length + (active.some(c=>!D.clubs.includes(c.id))?1:0);
  let h='';
  for(let i=0;i<n;i++){
    const cur=D.clubs[i]||'';
    const opts=all.filter(c=>c.id===cur || (!c.archived && !D.clubs.includes(c.id)));
    h+=`<select class="inp" onchange="setClub(${i},this.value)"><option value="">${cur?'（外す）':i?'＋ もう1つ追加':'部活を選択'}</option>${opts.map(c=>`<option value="${c.id}" ${c.id===cur?'selected':''}>${esc(c.name)}${c.archived?'（廃部）':''}</option>`).join('')}</select>`;

async function saveForm(){
  readForm();
  if(!D.name) return toast('氏名を入力してください',true);
  if(D.kind!=='lead'){
    if(!D.startDate) return toast('契約開始日を入力してください',true);
    if(D.endDate && D.endDate<D.startDate) return toast('契約終了日が開始日より前になっています',true);
    if(D.pauses.some(p=>!p.from || (p.to && p.to<p.from))) return toast('休止期間の月を確認してください',true);
    if(D.status==='休止中' && !D.pauses.some(p=>!p.to || p.to>=curYM())) D.pauses.push({from:curYM(),to:''});
  }
  if(D.kind==='lead' && D.stage==='見送り' && byId(D.id)?.stage!=='見送り') D.lostAt=STAGES.indexOf(autoStage(D));
  if(D.kind!=='lead' && !D.studentNo) D.studentNo=nextStudentNo();
  if(rfAdmin() && !(await rfLinkCustomer(D))) return;
  const {_enrolling,...rec}=D; const wasEnroll=_enrolling;
  const old=rec.id && !wasEnroll ? byId(rec.id) : null;
  if(old && old.kind!=='lead' && rec.kind!=='lead'){
    const fy=fyOf(curYM()), ms=fyMonths(fy);
    const fyB=c=>ms.reduce((a,m)=>a+billOf(c,m),0);
    const rows=[];
    if(monthlyFee(old)!==monthlyFee(rec)) rows.push(['月額',yen(monthlyFee(old)),yen(monthlyFee(rec)),monthlyFee(rec)-monthlyFee(old)]);
    if((Number(old.plan?.entryFee)||0)!==(Number(rec.plan?.entryFee)||0)) rows.push(['入学金',yen(old.plan?.entryFee),yen(rec.plan?.entryFee),(Number(rec.plan?.entryFee)||0)-(Number(old.plan?.entryFee)||0)]);
    const a=billedTotal(old), b=billedTotal(rec); if(a!==b) rows.push(['累計売上（今月まで）',yen(a),yen(b),b-a]);
    const fa=fyB(old), fb=fyB(rec); if(fa!==fb) rows.push([`今期（${fy}/9〜${fy+1}/8）の請求見込み`,yen(fa),yen(fb),fb-fa]);
    rows.push(...rfImpactRows(rec));
    const chg=ms.filter(m=>billOf(old,m)!==billOf(rec,m));
    if(rows.length && !(await confirmMoney(`${rec.name}さんの契約内容の変更`,rows,chg.length?`金額が変わる月：${mShort(chg[0])}${chg.length>1?'〜'+mShort(chg[chg.length-1]):''}（${chg.length}ヶ月）。入金済みの記録は変わりません。`:''))) return;
  }
  await run(()=>Store.saveCustomer(rec), wasEnroll?`${rec.name}さんを入学登録しました 🎉`:'保存しました');
  if(rfAdmin()) await rfPromote();
  closeModal();
  if(wasEnroll){ S.view='students'; S.f.status='契約中'; }
  render();
}
